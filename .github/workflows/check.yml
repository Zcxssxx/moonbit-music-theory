name: check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        version: [stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Moonbit Version
        run: |
          moon version --all

      - name: Install Dependencies
        run: |
          moon update

      - name: Moon Check
        run: moon check --deny-warn

      - name: All target checks
        run: moon check --target all --deny-warn

      - name: Moon Info Check
        shell: bash
        run: |
          moon info --target wasm,wasm-gc,js,native
          git diff --exit-code

      - name: Moon Format Check
        shell: bash
        run: |
          moon fmt
          git diff --exit-code

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Moon Test
        run: |
          moon test --target all

      - name: CLI smoke tests
        shell: bash
        run: |
          moon run src/cli -- report C major I,IV,V,I
          moon run src/cli -- report-json C major I,IV,V,I
          moon run src/cli -- midi-roundtrip I,IV,V,I
